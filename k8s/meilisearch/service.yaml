apiVersion: v1
kind: Service
metadata:
  name: meilisearch
  namespace: rahal
  labels:
    app.kubernetes.io/name: meilisearch
    app.kubernetes.io/component: search
spec:
  # Headless service keeps a stable DNS identity for the StatefulSet pod.
  clusterIP: None
  selector:
    app.kubernetes.io/name: meilisearch
    app.kubernetes.io/component: search
  ports:
    - name: http
      port: 7700
      targetPort: http
