apiVersion: apps/v1
kind: Deployment
metadata:
  name: rahal-api
  namespace: rahal
  labels:
    app.kubernetes.io/name: rahal-api
    app.kubernetes.io/component: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: rahal-api
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rahal-api
        app.kubernetes.io/component: api
    spec:
      containers:
        - name: rahal-api
          image: mustafa4004/rahal-api:dev-20260706
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: rahal-config
            - secretRef:
                name: rahal-secrets
          resources:
            requests:
              cpu: 150m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          # The API currently has no explicit /health endpoint, so use TCP checks.
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 3
