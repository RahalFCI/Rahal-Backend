apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: rahal-api
  namespace: rahal
  labels:
    app.kubernetes.io/name: rahal-api
    app.kubernetes.io/component: api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: rahal-api
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
