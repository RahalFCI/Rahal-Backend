apiVersion: v1
kind: Secret
metadata:
  name: rahal-secrets
  namespace: rahal
  labels:
    app.kubernetes.io/name: rahal
type: Opaque
stringData:
  # Copy this file to a private file such as secrets.yaml, replace these placeholders,
  # and apply that private file. Do not commit real secrets to git.
  DATABASE_USERNAME: "postgres"
  DATABASE_PASSWORD: "REPLACE_WITH_POSTGRES_PASSWORD"

  JWT_SECRET: "REPLACE_WITH_AT_LEAST_32_CHARACTERS"

  AdminUser__Email: "admin@example.com"
  AdminUser__Password: "REPLACE_WITH_ADMIN_PASSWORD"
  AdminUser__DisplayName: "Admin"

  RabbitMQ__Username: "REPLACE_WITH_RABBITMQ_USERNAME"
  RabbitMQ__Password: "REPLACE_WITH_RABBITMQ_PASSWORD"
  RABBITMQ_ERLANG_COOKIE: "REPLACE_WITH_LONG_RANDOM_ERLANG_COOKIE"

  MEILI_API_KEY: "REPLACE_WITH_MEILI_MASTER_KEY"

  CLOUDINARY_CLOUD_NAME: "REPLACE_WITH_CLOUDINARY_CLOUD_NAME"
  CLOUDINARY_API_KEY: "REPLACE_WITH_CLOUDINARY_API_KEY"
  CLOUDINARY_API_SECRET: "REPLACE_WITH_CLOUDINARY_API_SECRET"

  STRIPE_SECRET_KEY: "REPLACE_WITH_STRIPE_SECRET_KEY"
  STRIPE_PUBLISHABLE_KEY: "REPLACE_WITH_STRIPE_PUBLISHABLE_KEY"
  STRIPE_WEBHOOK_SECRET: "REPLACE_WITH_STRIPE_WEBHOOK_SECRET"

  FIREBASE_SERVICE_ACCOUNT_JSON: "REPLACE_WITH_SINGLE_LINE_FIREBASE_SERVICE_ACCOUNT_JSON"

  Mail__Username: "REPLACE_WITH_MAIL_USERNAME"
  Mail__Password: "REPLACE_WITH_MAIL_PASSWORD"
  Mail__FromEmail: "REPLACE_WITH_FROM_EMAIL"

  OAuth__Google__ClientId: "REPLACE_WITH_GOOGLE_CLIENT_ID"
